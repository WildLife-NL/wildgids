name: Build APK

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # TEST
  # ============================================================
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.TEST_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate test mocks
        run: dart run build_runner build

      - name: Run tests
        run: flutter test --coverage

  # ============================================================
  # ANALYZE
  # ============================================================
  analyze:
    needs: test
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.TEST_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

  # ============================================================
  # BUILD TEST APK
  # ============================================================
  build-test-apk:
    needs: analyze
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.TEST_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Set TEST version
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d '+' -f1)
          BUILD_NUMBER=${{ github.run_number }}

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV

          echo "TEST version: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Build TEST APK
        run: |
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Rename TEST APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wildgids-test-${VERSION_NAME}-${BUILD_NUMBER}.apk

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: wildgids-test-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/wildgids-test-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk

      - name: Create TEST GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          name: TEST ${{ env.VERSION_NAME }} (${{ env.BUILD_NUMBER }})
          body: |
            Automatische TEST release.

            API: TEST
            Versie: ${{ env.VERSION_NAME }}
            Build: ${{ env.BUILD_NUMBER }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: build/app/outputs/flutter-apk/wildgids-test-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # BUILD LIVE APK
  # ============================================================
  build-live-apk:
    needs:
      - analyze
      - build-test-apk

    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create LIVE .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.LIVE_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Set LIVE version
        run: |
          TODAY=$(date +%Y%m%d)
          RELEASE_DATE=$(date +%Y-%m-%d)

          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d '+' -f1)

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${TODAY}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${RELEASE_DATE}" >> $GITHUB_ENV

          echo "LIVE version: ${VERSION_NAME}+${TODAY}"

      - name: Install dependencies
        run: flutter pub get

      - name: Build LIVE APK
        run: |
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Rename LIVE APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wildgids-live-${VERSION_NAME}-${BUILD_NUMBER}.apk

      - name: Upload LIVE APK
        uses: actions/upload-artifact@v4
        with:
          name: wildgids-live-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/wildgids-live-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk

      - name: Create LIVE GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          name: LIVE ${{ env.VERSION_NAME }} (${{ env.BUILD_NUMBER }})
          body: |
            Automatische LIVE release.

            API: LIVE
            Versie: ${{ env.VERSION_NAME }}
            Build: ${{ env.BUILD_NUMBER }}
            Datum: ${{ env.RELEASE_DATE }}
            Commit: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/wildgids-live-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
