
name: Build APK

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: ./src

jobs:
  # ============================================================
  # TEST
  # ============================================================
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        env:
          BASE_URL: ${{ secrets.TEST_API_KEY }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
          REVIEWER_PIN: ${{ secrets.REVIEWER_PIN }}
        run: |
          {
            printf 'DEV_BASE_URL=%s\n' "$BASE_URL"
            printf 'DEV_DEBUG_TOOLS=false\n'
            printf 'REVIEWER_EMAIL=%s\n' "$REVIEWER_EMAIL"
            printf 'REVIEWER_TOKEN=%s\n' "$REVIEWER_TOKEN"
            printf 'REVIEWER_PIN=%s\n' "$REVIEWER_PIN"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate test mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

  # ============================================================
  # ANALYZE
  # ============================================================
  analyze:
    needs: test
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        env:
          BASE_URL: ${{ secrets.TEST_API_KEY }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
          REVIEWER_PIN: ${{ secrets.REVIEWER_PIN }}
        run: |
          {
            printf 'DEV_BASE_URL=%s\n' "$BASE_URL"
            printf 'DEV_DEBUG_TOOLS=false\n'
            printf 'REVIEWER_EMAIL=%s\n' "$REVIEWER_EMAIL"
            printf 'REVIEWER_TOKEN=%s\n' "$REVIEWER_TOKEN"
            printf 'REVIEWER_PIN=%s\n' "$REVIEWER_PIN"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

  # ============================================================
  # BUMP VERSION (YY.MM.DD+YYYYMMDD)
  # ============================================================
  bump-version:
    needs: analyze
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_date: ${{ steps.version.outputs.release_date }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from today
        id: version
        run: |
          VERSION_NAME=$(date -u +%y.%m.%d)
          BUILD_NUMBER=$(date -u +%Y%m%d)
          RELEASE_DATE=$(date -u +%Y-%m-%d)

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

          sed -i "s/^version:.*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml

          echo "Updated pubspec.yaml"
          grep '^version:' pubspec.yaml

      - name: Commit version bump
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/pubspec.yaml

          if git diff --staged --quiet; then
            echo "Version already up to date"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}"
            git push
          fi

  # ============================================================
  # BUILD TEST APK
  # ============================================================
  build-test-apk:
    needs: bump-version
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        env:
          BASE_URL: ${{ secrets.TEST_API_KEY }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
          REVIEWER_PIN: ${{ secrets.REVIEWER_PIN }}
        run: |
          {
            printf 'DEV_BASE_URL=%s\n' "$BASE_URL"
            printf 'DEV_DEBUG_TOOLS=false\n'
            printf 'REVIEWER_EMAIL=%s\n' "$REVIEWER_EMAIL"
            printf 'REVIEWER_TOKEN=%s\n' "$REVIEWER_TOKEN"
            printf 'REVIEWER_PIN=%s\n' "$REVIEWER_PIN"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build TEST APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Rename TEST APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wildgids-test-${VERSION_NAME}-${BUILD_NUMBER}.apk

      - name: Upload TEST APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: wildgids-test-apk
          retention-days: 30
          if-no-files-found: error
          path: src/build/app/outputs/flutter-apk/wildgids-test-*.apk

  # ============================================================
  # BUILD LIVE APK
  # ONLY ACTIONS ARTIFACT - NEVER AUTOMATIC RELEASE
  # ============================================================
  build-live-apk:
    needs: bump-version
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create LIVE .env
        env:
          BASE_URL: ${{ secrets.LIVE_API_KEY }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
          REVIEWER_PIN: ${{ secrets.REVIEWER_PIN }}
        run: |
          {
            printf 'DEV_BASE_URL=%s\n' "$BASE_URL"
            printf 'DEV_DEBUG_TOOLS=false\n'
            printf 'REVIEWER_EMAIL=%s\n' "$REVIEWER_EMAIL"
            printf 'REVIEWER_TOKEN=%s\n' "$REVIEWER_TOKEN"
            printf 'REVIEWER_PIN=%s\n' "$REVIEWER_PIN"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build LIVE APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Rename LIVE APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wildgids-live-${VERSION_NAME}-${BUILD_NUMBER}.apk

      - name: Upload LIVE APK to Actions only
        uses: actions/upload-artifact@v4
        with:
          name: wildgids-live-apk
          retention-days: 30
          if-no-files-found: error
          path: src/build/app/outputs/flutter-apk/wildgids-live-*.apk

  # ============================================================
  # GITHUB RELEASE - TEST APK ONLY
  # LIVE APK IS NOT INCLUDED
  # ============================================================
  release:
    needs:
      - bump-version
      - build-test-apk
      - build-live-apk
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download TEST APK only
        uses: actions/download-artifact@v4
        with:
          name: wildgids-test-apk
          path: release-apks

      - name: List TEST APK
        working-directory: .
        run: ls -lh release-apks/

      - name: Create GitHub Release with TEST APK only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.version_name }}-${{ needs.bump-version.outputs.build_number }}
          name: WildGids TEST ${{ needs.bump-version.outputs.version_name }}
          body: |
            Automatische TEST release van ${{ needs.bump-version.outputs.release_date }}.

            **Versie:** `${{ needs.bump-version.outputs.version_name }}+${{ needs.bump-version.outputs.build_number }}`

            ### Downloads

            - `wildgids-test-*.apk` — TEST API

            ### LIVE APK

            De LIVE APK wordt niet automatisch gepubliceerd.

            Download de LIVE APK via:
            GitHub > Actions > Build APK > Artifacts

            Artifact: `wildgids-live-apk`

          make_latest: true
          fail_on_unmatched_files: true
          files: release-apks/wildgids-test-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
